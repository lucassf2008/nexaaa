{% extends 'base.html' %}

{% block title %}Cadastro de Aluno — Nexa SENAI{% endblock %}

{% block content %}
<div class="auth-stage-wrapper">
  <div class="auth-card-box" style="max-width: 580px;">
    <!-- Logo Nexa SENAI -->
    <div style="text-align: center; margin-bottom: 8px;">
      <img src="{{ url_for('static', filename='images/logo_nexa_red.png') }}" alt="Nexa SENAI" class="auth-card-logo">
    </div>

    <h2 class="auth-card-title">Criar Conta de Aluno</h2>
    <p style="font-size: 14px; color: var(--text-secondary); margin-bottom: 24px;">
      Conecte-se com as melhores empresas patrocinadoras e parceiras do SENAI.
    </p>

    <form action="{{ url_for('auth.register_aluno') }}" method="POST" id="form-register-aluno">
      <div class="auth-input-group">
        <label class="auth-input-label">Nome Completo *</label>
        <input type="text" name="full_name" class="auth-input-field" placeholder="Ex: Lucas Gabriel da Silva" value="{{ form_data.full_name if form_data else '' }}" required>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
        <div class="auth-input-group">
          <label class="auth-input-label">CPF *</label>
          <input type="text" name="cpf" id="reg-cpf" class="auth-input-field" placeholder="000.000.000-00" data-mask="cpf" value="{{ form_data.cpf if form_data else '' }}" required>
        </div>

        <div class="auth-input-group">
          <label class="auth-input-label">Data de Nascimento *</label>
          <input type="date" name="birth_date" class="auth-input-field" value="{{ form_data.birth_date if form_data else '' }}" required>
        </div>
      </div>

      <div class="auth-input-group">
        <label class="auth-input-label">E-mail Cadastrado no SENAI *</label>
        <input type="email" name="email" class="auth-input-field" placeholder="seu.nome@aluno.senai.br" value="{{ form_data.email if form_data else '' }}" required>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
        <div class="auth-input-group">
          <label class="auth-input-label">Curso SENAI *</label>
          <input type="text" name="senai_course" class="auth-input-field" placeholder="Ex: Técnico em Automação" value="{{ form_data.senai_course if form_data else '' }}" required>
        </div>

        <div class="auth-input-group">
          <label class="auth-input-label">Área de Atuação *</label>
          <select name="professional_area" class="auth-input-field">
            <option value="Desenvolvimento de software">Desenvolvimento de software</option>
            <option value="Automação industrial">Automação industrial</option>
            <option value="Dados">Dados e Inteligência Artificial</option>
            <option value="Eletrônica">Eletrônica e Eletrotécnica</option>
            <option value="Design">Design e UI/UX</option>
            <option value="Mecânica">Mecânica e Usinagem</option>
            <option value="Administração">Administração e Gestão</option>
            <option value="Marketing">Marketing e Comunicação</option>
            <option value="Outras áreas">Outras áreas</option>
          </select>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
        <div class="auth-input-group">
          <label class="auth-input-label">Senha de Acesso *</label>
          <input type="password" name="password" id="reg-pass" class="auth-input-field" placeholder="Mínimo 6 caracteres" required>
        </div>

        <div class="auth-input-group">
          <label class="auth-input-label">Confirmar Senha *</label>
          <input type="password" name="password_confirm" id="reg-pass-confirm" class="auth-input-field" placeholder="Repita sua senha" required>
        </div>
      </div>

      <div style="margin-top: 24px; display: flex; flex-direction: column; gap: 12px;">
        <button type="submit" class="btn-senai btn-block" style="height: 48px; font-size: 15px;">
          CONCLUIR CADASTRO E ENTRAR
        </button>

        <a href="{{ url_for('auth.login') }}" class="btn-senai-outline btn-block" style="height: 44px;">
          Já possui conta? Fazer Login
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
