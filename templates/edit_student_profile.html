{% extends 'base.html' %}

{% block title %}Editar Perfil — Nexa SENAI{% endblock %}

{% block content %}
<div style="max-width: 760px; margin: 0 auto;">
  <div style="margin-bottom: 18px;">
    <a href="{{ url_for('profile.student_profile', student_id=student.id) }}" style="color: var(--text-secondary); font-size: 14px; font-weight: 600;">
      <i class="fas fa-arrow-left"></i> Voltar ao Meu Perfil
    </a>
  </div>

  <div class="nexa-card" style="padding: 32px;">
    <h2 style="font-size: 22px; font-weight: 800; color: var(--senai-red); margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid var(--border-light);">
      Editar Informações Profissionais
    </h2>

    <form action="{{ url_for('profile.edit_student_profile') }}" method="POST" enctype="multipart/form-data">
      <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 24px;">
        <img src="{{ student.avatar_url }}" alt="{{ student.full_name }}" style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid var(--senai-red);">
        <div>
          <label class="auth-input-label">Alterar Foto de Perfil:</label>
          <input type="file" name="avatar" accept="image/*" class="auth-input-field" style="padding-top: 8px;">
        </div>
      </div>

      <div class="auth-input-group">
        <label class="auth-input-label">Nome Completo *</label>
        <input type="text" name="full_name" class="auth-input-field" value="{{ student.full_name }}" required>
      </div>

      <div class="auth-input-group">
        <label class="auth-input-label">Título Profissional / Headline *</label>
        <input type="text" name="headline" class="auth-input-field" value="{{ student.headline }}" placeholder="Ex: Estagiário de Automação Industrial | Aluno SENAI" required>
      </div>

      <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 16px;">
        <div class="auth-input-group">
          <label class="auth-input-label">Cidade</label>
          <input type="text" name="city" class="auth-input-field" value="{{ student.city }}">
        </div>
        <div class="auth-input-group">
          <label class="auth-input-label">Estado (UF)</label>
          <input type="text" name="state" class="auth-input-field" value="{{ student.state }}" maxlength="2">
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
        <div class="auth-input-group">
          <label class="auth-input-label">Telefone / WhatsApp</label>
          <input type="text" name="phone" class="auth-input-field" data-mask="phone" value="{{ student.phone or '' }}" placeholder="(00) 00000-0000">
        </div>

        <div class="auth-input-group">
          <label class="auth-input-label">Status do Curso</label>
          <select name="course_status" class="auth-input-field">
            <option value="Em andamento" {% if student.course_status == 'Em andamento' %}selected{% endif %}>Em andamento</option>
            <option value="Concluído" {% if student.course_status == 'Concluído' %}selected{% endif %}>Concluído</option>
          </select>
        </div>
      </div>

      <div class="auth-input-group">
        <label class="auth-input-label">Curso Realizado no SENAI</label>
        <input type="text" name="senai_course" class="auth-input-field" value="{{ student.senai_course }}">
      </div>

      <div class="auth-input-group">
        <label class="auth-input-label">Sobre Mim (Biografia Profissional):</label>
        <textarea name="about_me" rows="6" class="auth-input-field" style="height: auto; padding: 12px;">{{ student.about_me or '' }}</textarea>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">
        <a href="{{ url_for('profile.student_profile', student_id=student.id) }}" class="btn-senai-outline">Cancelar</a>
        <button type="submit" class="btn-senai">Salvar Alterações</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
